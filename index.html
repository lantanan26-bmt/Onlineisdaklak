    <script>
      /**
       * Browser extension & iframe compatibility shim.
       * Certain browser extensions (e.g. proxy/VPN extensions like Urban VPN, scrapers, translate tools)
       * attempt to intercept network traffic by executing `window.fetch = ...`.
       * In sandboxed iframes, `window.fetch` can be an accessor property with only a getter,
       * triggering "TypeError: Cannot set property fetch of #<Window> which has only a getter".
       * Defining a configurable getter & setter on `window` guarantees safe assignment and prevents unhandled errors.
       */
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' ? window.fetch : null;
          var currentFetch = originalFetch;

          // Provide both getter and setter on window
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });

          // Also patch prototype if it exists and has an un-settable descriptor
          var proto = Object.getPrototypeOf(window);
          if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
            var protoDesc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // Ignore if descriptor modification is disallowed in strict environments
        }

        // Global safety net: suppress unhandled runtime errors coming from third-party browser extensions
        window.addEventListener(
          'error',
          function(event) {
            var filename = event.filename || '';
            var message = (event.message || '') + '';
            if (
              filename.indexOf('chrome-extension://') !== -1 ||
              filename.indexOf('moz-extension://') !== -1 ||
              filename.indexOf('safari-extension://') !== -1 ||
              message.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function(event) {
            var reason = event.reason;
            var reasonStr = (reason && (reason.stack || reason.message || String(reason))) || '';
            if (
              reasonStr.indexOf('chrome-extension://') !== -1 ||
              reasonStr.indexOf('moz-extension://') !== -1 ||
              reasonStr.indexOf('safari-extension://') !== -1 ||
              reasonStr.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
